name: Build HD artwork
on:
  push:
    branches: [main]
    paths: ['builder.py', 'requirements.txt', 'tests/**', '.github/workflows/hd-artwork.yml']
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Source channel to build (upload matching originals first)'
        required: true
        type: choice
        options: [preview, stable]
        default: preview
      maximum_storage_gib:
        description: 'Combined R2 bucket safety budget in GiB (does not include other account buckets)'
        required: true
        default: '8'
      retry_missing_scans:
        description: 'Recheck scans that were previously unavailable or did not match the configured artwork'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hd-artwork-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_SOURCE_BUCKET: ${{ vars.R2_SOURCE_BUCKET }}
      R2_OUTPUT_BUCKET: ${{ vars.R2_OUTPUT_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      HD_SIGNING_KEY: ${{ secrets.HD_SIGNING_KEY }}
      BUILD_CHANNEL: ${{ inputs.channel || vars.HD_AUTO_CHANNEL || 'stable' }}
      STORAGE_BUDGET: ${{ inputs.maximum_storage_gib || vars.HD_MAXIMUM_STORAGE_GIB || '8' }}
      RETRY_MISSING: ${{ inputs.retry_missing_scans }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate, verify and atomically publish
        run: |
          if [ "$RETRY_MISSING" = "true" ]; then
            python builder.py build --channel "$BUILD_CHANNEL" --maximum-storage-gib "$STORAGE_BUDGET" --retry-missing
          else
            python builder.py build --channel "$BUILD_CHANNEL" --maximum-storage-gib "$STORAGE_BUDGET" --only-if-changed
          fi